[project]
name = "leetcode"
version = "0.1.0"
description = "An project for solve leetcode problems with python3."
readme = "README.md"
authors = [{ name = "R-Sh1ki", email = "ryougi.shiki.kong@outlook.com" }]
requires-python = ">=3.12"
dependencies = [
    "marimo",
    "markdownify>=1.2.3",
    "polars[pyarrow]>=1.44.2",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
leetcode = "leetcode:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["marimo>=0.24.0", "ruff>=0.16.6"]
